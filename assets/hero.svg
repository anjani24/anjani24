<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#1A2028" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gm"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    
    .b1 { animation: f1 14s ease-in-out infinite; }
    .b2 { animation: f2 18s ease-in-out infinite; }
    .b3 { animation: f3 16s ease-in-out infinite; }
    @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(140px,60px); } }
    @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,-40px); } }
    @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px,-70px); } }
    .tw { opacity: 0; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 0; } 50% { opacity: .7; } }
    .role { opacity: 0; animation: role 12s ease-in-out infinite both; } .role.first { opacity: 1; }
    @keyframes role { 0% { opacity: 0; transform: translateY(14px); } 4% { opacity: 1; transform: translateY(0); }
      21% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 0; } }
    .node { animation: node 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes node { 0%,100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fadeup { animation: up .9s ease-out both; }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    
  * { animation: none !important; }
  </style>
  
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0F141A"/>
    
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gm)"/>
    
  </g>
