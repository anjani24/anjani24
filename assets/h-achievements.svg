<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#FFB86B"/><stop offset="0.33" stop-color="#FF6E7F"/>
      <stop offset="0.66" stop-color="#C084FC"/><stop offset="1" stop-color="#FFB86B"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    
    .sweep { animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-220px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(1100px); opacity: 0; } }
    .grow { animation: grow 1.2s ease-out forwards; transform: scaleX(0); transform-origin: 0 0; }
    @keyframes grow { to { transform: scaleX(1); } }
    
  </style>
  
  <text class="mono" x="4" y="44" font-size="15" font-weight="700" fill="#C084FC" letter-spacing="2">05 /</text>
  <text x="62" y="46" font-size="32" font-weight="800" fill="#F5F1EA" letter-spacing="-0.5">Achievements</text>
  <text x="303" y="45" font-size="15" fill="#958FA9">milestones so far</text>
  <rect x="4" y="70" width="1190" height="2" rx="1" fill="#2B2940"/>
  <rect class="grow" x="4" y="69" width="150" height="4" rx="2" fill="url(#g)"/>
  <rect class="sweep" x="4" y="70" width="140" height="2" fill="url(#g)" opacity="0.9"/>

</svg>