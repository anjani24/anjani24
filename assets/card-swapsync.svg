<svg xmlns="http://www.w3.org/2000/svg" width="580" height="340" viewBox="0 0 580 340" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="580" height="340" rx="22"/></clipPath>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/></linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    
    .orbit { stroke-dasharray: 18 82; animation: orbit 7s linear infinite; }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    .breathe { animation: br 5s ease-in-out infinite; }
    @keyframes br { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    .tag { animation: up .6s ease-out both; }
    .fadeup { animation: up .8s ease-out both; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
  * { animation: none !important; }
  </style>
  
  <g clip-path="url(#card)">
    <rect width="580" height="340" fill="#141A21"/>
    
    <rect y="270" width="580" height="1" fill="#252D37"/>
  </g>
  <rect x="1" y="1" width="578" height="338" rx="21" stroke="#252D37" stroke-width="1.5"/>
  
  <rect x="28" y="26" width="48" height="48" rx="14" fill="#C9D1D9" fill-opacity="0.14" stroke="#C9D1D9" stroke-opacity="0.5"/>
  <text class="mono" x="52" y="55" font-size="16" font-weight="800" fill="#C9D1D9" text-anchor="middle">SW</text>
  <text x="92" y="48" font-size="20" font-weight="800" fill="#E6EDF3">SwapSync</text>
  <text x="92" y="70" font-size="13.5" fill="#6E7A88">Hostel room swapping platform</text>
  <rect x="480" y="30" width="72" height="26" rx="13" fill="#C9D1D9" fill-opacity="0.12" stroke="#C9D1D9" stroke-opacity="0.55"/><circle cx="494" cy="43" r="3.5" fill="#C9D1D9"></circle><text x="524" y="47" font-size="11" font-weight="700" letter-spacing="1" fill="#C9D1D9" text-anchor="middle">LIVE</text>
  <text x="28" y="122" font-size="14.5" fill="#AEB8C4">Room discovery, reverse matching and three-way circular</text><text x="28" y="145" font-size="14.5" fill="#AEB8C4">swaps so students can find a room trade that actually</text><text x="28" y="168" font-size="14.5" fill="#AEB8C4">works for everyone involved.</text>
  <text class="fadeup" style="animation-delay:.3s" x="28" y="232" font-size="34" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">3-way</text><text class="fadeup" style="animation-delay:.45s" x="28" y="254" font-size="12.5" fill="#6E7A88">circular swap matching</text><text class="fadeup" style="animation-delay:.3s" x="222.00000000000003" y="232" font-size="34" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">Live</text><text class="fadeup" style="animation-delay:.45s" x="222.00000000000003" y="254" font-size="12.5" fill="#6E7A88">deployed on Vercel</text>
  
  <g class="tag" style="animation-delay:0.40s"><rect x="28" y="288" width="69" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="63" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">Next.js</text></g><g class="tag" style="animation-delay:0.48s"><rect x="105.08000000000001" y="288" width="88" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="149" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">TypeScript</text></g><g class="tag" style="animation-delay:0.56s"><rect x="201.48000000000002" y="288" width="76" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="239" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">Supabase</text></g><g class="tag" style="animation-delay:0.64s"><rect x="285.0" y="288" width="63" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="316" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">Vercel</text></g>

</svg>