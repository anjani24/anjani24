  <text x="28" y="122" font-size="14.5" fill="#AEB8C4">REST API with task CRUD, pagination &amp; sorting, user-level</text><text x="28" y="145" font-size="14.5" fill="#AEB8C4">task isolation, Alembic migrations and Pytest suites. Refresh-</text><text x="28" y="168" font-size="14.5" fill="#AEB8C4">token rotation with family-wide reuse detection.</text>
  
