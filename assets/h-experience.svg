<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/>
    </linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    
    .sweep { animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-220px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(1100px); opacity: 0; } }
    .grow { animation: grow 1.2s ease-out forwards; transform: scaleX(0); transform-origin: 0 0; }
    @keyframes grow { to { transform: scaleX(1); } }
    
  * { animation: none !important; }
  </style>
  
  <text class="mono" x="4" y="44" font-size="15" font-weight="700" fill="#C9D1D9" letter-spacing="2">02 /</text>
  <text x="62" y="46" font-size="32" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">Experience</text>
  <text x="267" y="45" font-size="15" fill="#6E7A88">research &amp; industry</text>
  <rect x="4" y="70" width="1190" height="2" rx="1" fill="#252D37"/>
  <rect  x="4" y="69" width="150" height="4" rx="2" fill="url(#g)"/>
  

</svg>