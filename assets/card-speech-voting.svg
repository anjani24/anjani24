<svg xmlns="http://www.w3.org/2000/svg" width="580" height="340" viewBox="0 0 580 340" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="580" height="340" rx="22"/></clipPath>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#C9D1D9"/></linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    
    .orbit { stroke-dasharray: 18 82; animation: orbit 7s linear infinite; }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    .breathe { animation: br 5s ease-in-out infinite; }
    @keyframes br { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    .tag { animation: up .6s ease-out both; }
    .fadeup { animation: up .8s ease-out both; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
  .fadeup,.tag,.node,.arrow,.b1,.b2,.b3 { animation: none !important; }
  </style>
  
  <g clip-path="url(#card)">
    <rect width="580" height="340" fill="#141A21"/>
    
    <rect y="270" width="580" height="1" fill="#252D37"/>
  </g>
  <rect x="1" y="1" width="578" height="338" rx="21" stroke="#252D37" stroke-width="1.5"/>
  
  <rect x="28" y="26" width="48" height="48" rx="14" fill="#C9D1D9" fill-opacity="0.14" stroke="#C9D1D9" stroke-opacity="0.5"/>
  <text class="mono" x="52" y="55" font-size="16" font-weight="800" fill="#C9D1D9" text-anchor="middle">SV</text>
  <text x="92" y="48" font-size="20" font-weight="800" fill="#E6EDF3">Speech-Aware Voting</text>
  <text x="92" y="70" font-size="13.5" fill="#6E7A88">Accessible e-voting for dysarthric users</text>
  <rect x="383" y="30" width="169" height="26" rx="13" fill="#7AA2F7" fill-opacity="0.12" stroke="#7AA2F7" stroke-opacity="0.55"/><circle cx="397" cy="43" r="3.5" fill="#7AA2F7"></circle><text x="476" y="47" font-size="11" font-weight="700" letter-spacing="1" fill="#7AA2F7" text-anchor="middle">PATENT PUBLISHED</text>
  <text x="28" y="122" font-size="14.5" fill="#AEB8C4">Speech-to-vote pipeline built on a fine-tuned Wav2Vec2,</text><text x="28" y="145" font-size="14.5" fill="#AEB8C4">shipped with Docker, AWS and GitHub Actions CI/CD, with</text><text x="28" y="168" font-size="14.5" fill="#AEB8C4">encrypted, auditable vote records in PostgreSQL.</text>
  <text class="fadeup" style="animation-delay:.3s" x="28" y="232" font-size="34" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">87%</text><text class="fadeup" style="animation-delay:.45s" x="28" y="254" font-size="12.5" fill="#6E7A88">dysarthric speech accuracy</text><text class="fadeup" style="animation-delay:.3s" x="250.00000000000003" y="232" font-size="34" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">CI/CD</text><text class="fadeup" style="animation-delay:.45s" x="250.00000000000003" y="254" font-size="12.5" fill="#6E7A88">Docker + AWS deploys</text>
  
  <g class="tag" style="animation-delay:0.40s"><rect x="28" y="288" width="76" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="66" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">Wav2Vec2</text></g><g class="tag" style="animation-delay:0.48s"><rect x="111.52000000000001" y="288" width="56" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="140" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">React</text></g><g class="tag" style="animation-delay:0.56s"><rect x="175.72000000000003" y="288" width="88" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="220" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">TypeScript</text></g><g class="tag" style="animation-delay:0.64s"><rect x="272.12" y="288" width="88" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="316" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">PostgreSQL</text></g><g class="tag" style="animation-delay:0.72s"><rect x="368.52" y="288" width="63" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="400" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">Docker</text></g><g class="tag" style="animation-delay:0.80s"><rect x="439.15999999999997" y="288" width="43" height="26" rx="13.0" fill="#0F141A" stroke="#252D37"/><text x="461" y="305.1" font-size="11.5" font-weight="600" fill="#AEB8C4" text-anchor="middle">AWS</text></g>

</svg>